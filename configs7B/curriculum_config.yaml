# ==============================================================================
# Mock-D1 (7B Class) Trauining Curriculum Configuration (curriculum_config.yaml)
# ==============================================================================

model:
  vocab_size: 262144
  max_seq_len: 262144
  hidden_dim: 3072
  kqv_dim: 4096
  intermediate_dim: 12288
  num_layers: 36
  num_blocks: 9
  focus_layers_per_block: 3
  retention_layers_per_block: 1
  focus_heads: 32
  retention_heads: 1
  retention_latent_dim: 512
  phi_act: "silu"
  tie_word_embeddings: true
  use_lora_deembed: true
  lora_deembed_rank: 256
  rms_norm_eps: 1.0e-6
  initializer_range: 0.02

# Progressive Curriculum Schedule
curriculum:
  stages:
    - name: "Stage 1 (128)"
      seq_len: 128
      batch_size: 32
      gradient_accumulation_steps: 4
      lr: 3.0e-4
      max_steps: 10000

    - name: "Stage 2 (256)"
      seq_len: 256
      batch_size: 16
      gradient_accumulation_steps: 4
      lr: 3.0e-4
      max_steps: 25000

    - name: "Stage 3 (1024)"
      seq_len: 1024
      batch_size: 4
      gradient_accumulation_steps: 4
      lr: 2.5e-4
      max_steps: 50000

    - name: "Stage 4 (8192)"
      seq_len: 8192
      batch_size: 1
      gradient_accumulation_steps: 8
      lr: 1.5e-4
      max_steps: 75000

    - name: "Stage 5 (Full Context: 262k)"
      seq_len: 262144
      batch_size: 1
      gradient_accumulation_steps: 1
      lr: 8.0e-5
      max_steps: 100000

training:
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  warmup_steps: 1000
  save_every: 2500
  output_dir: "./checkpoints/curriculum_7b"

data:
  dataset_name: "HuggingFaceFW/fineweb"
  tokenizer_name: "google/gemma-7b"
  buffer_size: 20000