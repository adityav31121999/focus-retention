# ==============================================================================
# Mock-D1 (1.7B) Progressive Curriculum — Google Colab (1x T4 / P100 GPU)
# Budget: 55-Minute Sessions with Direct Google Drive Backup
# ==============================================================================

model:
  model_name: "Mock-D1-1.7B"
  vocab_size: 128256
  max_seq_len: 65536
  hidden_dim: 1536
  kqv_dim: 2304
  intermediate_dim: 6144
  num_layers: 36
  num_blocks: 9
  focus_layers_per_block: 3
  retention_layers_per_block: 1
  focus_heads: 18
  use_rope: true
  rope_base: 500000.0
  use_focus_decay: true
  retention_heads: 1
  retention_latent_dim: 256
  phi_act: "silu"
  tie_word_embeddings: true
  use_lora_deembed: true
  lora_deembed_rank: 128
  chunk_size: 512
  use_chunked_scan: true
  rms_norm_eps: 1.0e-6
  initializer_range: 0.02
  dropout: 0.0

curriculum:
  stages:
    - name: "Stage 1 (128)  [Adafactor]"
      seq_len: 128
      batch_size: 1
      gradient_accumulation_steps: 1
      optimizer: "adafactor"
      lr: 1.0e-3
      max_steps: 10000

    - name: "Stage 2 (512)  [Adafactor]"
      seq_len: 512
      batch_size: 1
      gradient_accumulation_steps: 1
      optimizer: "adafactor"
      lr: 8.0e-4
      max_steps: 25000

    - name: "Stage 3 (2048) [Adafactor]"
      seq_len: 2048
      batch_size: 1
      gradient_accumulation_steps: 1
      optimizer: "adafactor"
      lr: 5.0e-4
      max_steps: 50000

    - name: "Stage 4 (4096) [Muon]"
      seq_len: 4096
      batch_size: 1
      gradient_accumulation_steps: 1
      optimizer: "muon"
      lr: 2.0e-2
      max_steps: 75000

    - name: "Stage 5 (4096) [Muon]"
      seq_len: 4096
      batch_size: 1
      gradient_accumulation_steps: 1
      optimizer: "muon"
      lr: 1.0e-2
      max_steps: 100000

training:
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  warmup_steps: 500
  min_lr_ratio: 0.1
  save_every: 250
  session_duration_minutes: 60.0       # Auto-saves at 55 minutes for Colab safety
  keep_last_n_checkpoints: 2
  output_dir: "/content/drive/MyDrive/mock_d1_weights"

data:
  tokenizer_name: "HuggingFaceTB/SmolLM3-3B"
  buffer_size: 10000                   # Safe for Colab's 12.7 GB CPU RAM limit
  split: "train"
  seed: 42
  datasets:
    - name: "roneneldan/TinyStories"
      config: null
    - name: "HuggingFaceTB/smollm-corpus"
      config: "cosmopedia-v2"