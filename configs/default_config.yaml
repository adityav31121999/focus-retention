# ==============================================================================
# Mock-D1 (7B Class) Architecture Configuration
# ==============================================================================

model:
  # General Dimensions
  vocab_size: 262144                   # Gemma Vocab (2^18)
  max_seq_len: 262144                  # Context window C_W (2^18)
  hidden_dim: 3072                     # D_E
  kqv_dim: 4096                        # D_KQV
  intermediate_dim: 12288              # D_FFN (SwiGLU)
  
  # Block & Layer Topology
  num_layers: 36                       # N_L
  num_blocks: 9                        # N_B = 36 / (3 + 1)
  focus_layers_per_block: 3            # N_F (27 Focus layers total)
  retention_layers_per_block: 1        # N_R (9 Retention layers total)
  
  # Focus Attention Weights
  focus_heads: 32                      # N_H
  # d_h (Head Dim) = 4096 / 32 = 128
  
  # Retention Weights
  retention_heads: 1
  retention_latent_dim: 512            # d_L (Latent KV-cache dimension)
  phi_act: "silu"
  
  # Embeddings & LoRA De-Embedding Head
  tie_word_embeddings: true
  use_lora_deembed: true
  lora_deembed_rank: 256               # r = 256
  
  # Normalization & Regularization
  rms_norm_eps: 1.0e-6
  initializer_range: 0.02
  dropout: 0.0

training:
  learning_rate: 2.5e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  warmup_steps: 2000
  max_steps: 100000
  batch_size: 1
  gradient_accumulation_steps: 32
  save_every: 2500
  eval_every: 500
  output_dir: "./checkpoints/mock_d1_7b"

data:
  dataset_name: "HuggingFaceFW/fineweb"
  tokenizer_name: "google/gemma-7b"     # 262,144 Vocab Tokenizer
  seq_len: 4096                        # Chunk length during standard pretraining
  buffer_size: 20000